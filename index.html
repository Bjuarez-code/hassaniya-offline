function render(){
 const z=norm(q.value.trim());

  const okL=lang==="Todos"||(lang==="Favoritos"?favs.has(x.es):(x.lang===lang||x.lang==="Ambos"));
  const okC=cat==="Todas"||x.cat===cat;

 });
